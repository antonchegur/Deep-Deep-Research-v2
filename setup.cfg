[flake8]
max-line-length = 100
exclude = .git,__pycache__,build,dist
ignore = E203,W503

[isort]
line_length = 100
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*

[coverage:run]
source = src
omit = 
    */test_*.py
    */conftest.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
    pass
    raise ImportError 